[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarlens-backend"
version = "0.1.0"
description = "ScholarLens backend — evidence-backed research gap discovery."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "neo4j>=5.23,<6",
    "qdrant-client>=1.10,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "httpx>=0.28,<1",
    "arxiv>=4.0,<5",
    "bibtexparser>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "pre-commit>=3.8,<4",
    "respx>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
