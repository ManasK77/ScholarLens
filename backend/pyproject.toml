[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarlens-backend"
version = "0.1.0"
description = "ScholarLens backend — evidence-backed research gap discovery."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "neo4j>=5.23,<6",
    "qdrant-client>=1.10,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "httpx>=0.28,<1",
    "arxiv>=4.0,<5",
    "bibtexparser>=1.4,<2",
    "python-multipart>=0.0.12,<1",
    "pymupdf>=1.28,<2",
    "pdfplumber>=0.11,<1",
    # transformers: widened to allow 5.x — sentence-transformers>=6.0 requires
    # transformers>=5.0, discovered as a real resolver conflict at install time
    # (RESEARCH.md's <5 pin assumed 4.x compatibility with SciBERT checkpoints,
    # which also holds under 5.x).
    "transformers>=4.57,<6",
    # torch: install the CPU-only wheel explicitly BEFORE `pip install -e ".[dev]"`:
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    # A plain `pip install -e ".[dev]"` alone would resolve torch from the
    # default PyPI index, which can pull a multi-GB CUDA-enabled build.
    "torch>=2.9,<3",
    "sentence-transformers>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "pre-commit>=3.8,<4",
    "respx>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that load a real ML model or hit a real external service; excluded from the default fast run",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
