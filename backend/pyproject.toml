[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarlens-backend"
version = "0.1.0"
description = "ScholarLens backend — evidence-backed research gap discovery."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "pre-commit>=3.8,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
