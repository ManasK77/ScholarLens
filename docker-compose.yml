services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/127.0.0.1/6333) && exit 0 || exit 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  grobid:
    image: grobid/grobid:0.9.0-crf
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8070/api/isalive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - pdf_data:/data/pdfs
      # ACL_ANTHOLOGY_BIB_PATH's default lives here. The export is a ~180MB
      # decompressed download that `/collect` re-fetches whenever the file is
      # absent, so without this volume every `up -d --build backend` — the
      # command README §12 prescribes after any code change — pays for it
      # again. `download_anthology_export` is a no-op once the file exists.
      - corpus_cache:/app/data
      # SPECTER2, GLiNER2, DeBERTa-MNLI and the cross-encoder are pulled from
      # Hugging Face on first use — together ~1.6GB. Without this volume the
      # rebuild above re-downloads all of them before the pipeline can run.
      - model_cache:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      grobid:
        condition: service_healthy

volumes:
  neo4j_data:
  qdrant_data:
  postgres_data:
  pdf_data:
  corpus_cache:
  model_cache:
